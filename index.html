<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="An interactive lab for teaching hypothesis testing: sampling distributions, a live one-sample t-test, Type I and II errors, a test-picking flow chart, practice questions and a short resource list.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<title>Hypothesis Testing Lab</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;500;600;700;800&display=swap">
<style>
/* Centred column, segmented control, soft tiles - the Python Activities layout.
   Elon maroon and gold for the chrome; a validated three-colour set for the data. */
:root{
  --bg:#ffffff; --bg-2:#f6f4f1; --card:#ffffff; --fill:#f4f1ec; --fill-2:#ece7df;
  --text:#191410; --text-2:#6b6257; --text-3:#8d8377;
  --sep:#ded7cc; --sep-2:#ece7df;
  --maroon:#73000a; --maroon-2:#8f1b23; --gold:#b59a57; --gold-2:#8a7230;
  --curve:#0b8ea3; --sim:#9b2226; --samp:#9a7b25;
  --good:#46742b; --good-bg:#eef3e8; --warn:#b7410e; --warn-bg:#fcf0e8; --bad:#8f1b23;
  --grid:#ece7df;
  --r:18px; --r-sm:12px;
  --ui:"Commissioner",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --display:var(--ui);
  --math:var(--ui);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --fs-1:40px; --fs-2:30px; --fs-3:23px; --fs-4:19px; --fs-5:16px;
  --fs-6:14px; --fs-7:12px; --fs-8:10.5px; --fs-code:13.5px;
  --shadow:0 4px 20px rgba(60,40,20,.05), 0 1px 3px rgba(60,40,20,.04);
  --shadow-lg:0 18px 46px rgba(60,40,20,.10), 0 2px 8px rgba(60,40,20,.05);
  --ease:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#121110; --bg-2:#191715; --card:#1f1d1a; --fill:#26231f; --fill-2:#312d27;
  --text:#f3eee6; --text-2:#a79c8c; --text-3:#8d8275;
  --sep:#36312a; --sep-2:#2a2621;
  --maroon:#c75560; --maroon-2:#d9747e; --gold:#d8c48a; --gold-2:#d8c48a;
  --curve:#1f9fb3; --sim:#c75560; --samp:#b38f2e;
  --good:#7aa953; --good-bg:#1b2416; --warn:#dd7a3c; --warn-bg:#2a1a10; --bad:#c75560;
  --grid:#2a2621;
  --shadow:0 4px 20px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  --shadow-lg:0 18px 46px rgba(0,0,0,.65), 0 2px 8px rgba(0,0,0,.5); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#121110; --bg-2:#191715; --card:#1f1d1a; --fill:#26231f; --fill-2:#312d27;
  --text:#f3eee6; --text-2:#a79c8c; --text-3:#8d8275;
  --sep:#36312a; --sep-2:#2a2621;
  --maroon:#c75560; --maroon-2:#d9747e; --gold:#d8c48a; --gold-2:#d8c48a;
  --curve:#1f9fb3; --sim:#c75560; --samp:#b38f2e;
  --good:#7aa953; --good-bg:#1b2416; --warn:#dd7a3c; --warn-bg:#2a1a10; --bad:#c75560;
  --grid:#2a2621;
  --shadow:0 4px 20px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  --shadow-lg:0 18px 46px rgba(0,0,0,.65), 0 2px 8px rgba(0,0,0,.5); color-scheme:dark; }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);
  font-size:var(--fs-5);line-height:1.55;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums}

.wrap{max-width:1040px;margin:0 auto;
  padding-left:max(22px,env(safe-area-inset-left,0px));
  padding-right:max(22px,env(safe-area-inset-right,0px));
  padding-block:30px 64px}

/* ---------- masthead ---------- */
.mast{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;
  margin-bottom:20px}
.mast h1{font-size:var(--fs-2);line-height:1.1;letter-spacing:-.03em;margin:0;font-weight:700}

.calc{padding:16px 18px 6px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.crow{background:var(--card);border:1px solid var(--sep-2);border-radius:var(--r-sm);
  padding:15px 18px 13px;min-width:0}
.chead{display:flex;align-items:center;gap:9px;margin-bottom:10px;
  padding-bottom:9px;border-bottom:1px solid var(--sep-2)}
.chead .cstep{width:17px;height:17px;border-radius:50%;background:var(--fill-2);color:var(--text-2);
  display:grid;place-items:center;font-size:10px;font-weight:600;flex:none}
.chead .ctitle{font-size:var(--fs-8);letter-spacing:.09em;text-transform:uppercase;
  color:var(--text-3);font-weight:600;min-width:0}
.cmath{overflow-x:auto;padding:4px 0 6px}
math.mml{font-size:1.34em;color:var(--text);display:block;text-align:left;line-height:1.2;
  font-family:var(--math);font-weight:400;font-style:normal;
  font-variant-numeric:tabular-nums lining-nums}
/* upright throughout - no slanted letters anywhere on the page */
math.mml mi,math.mml mn,math.mml mo,math.mml mtext{font-family:var(--math);font-style:normal}
math.mml mi{font-weight:500}
math.mml mo{font-weight:400}
/* only the radical sign itself comes from a math font; what sits under it does not */
math.mml msqrt{font-family:"Latin Modern Math","Cambria Math",math,serif}
math.mml msqrt>*{font-family:var(--ui);font-style:normal}
math.mml .num{color:var(--text-2)}
math.mml .res{font-weight:600}
math.mml .res.samp{color:var(--samp)} math.mml .res.good{color:var(--good)}
math.mml .res.bad{color:var(--bad)}
@media (max-width:560px){ math.mml{font-size:1.04em} .crow{padding:13px 14px 11px} }
.labnote{margin:0;padding:2px 18px 18px;color:var(--text-2);font-size:var(--fs-6);max-width:70ch}
.labnote b{color:var(--text)} .labnote i{color:var(--text)}
.hyp{padding:0 18px}

.ctrl.wide{grid-column:1/-1;display:flex;align-items:center;justify-content:center;padding:10px}
.ctrl.wide .btnrow{margin-top:0!important}
.ctrl.hero{border-color:var(--maroon);box-shadow:0 0 0 2px color-mix(in srgb,var(--maroon) 16%,transparent)}
.ctrl.hero label span:first-child{color:var(--maroon);font-weight:700}
.simlabel{font-size:var(--fs-8);letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);
  font-weight:700;border-top:1px solid var(--sep-2);padding-top:10px;margin-top:2px}
.hyp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 12px}
.hyp>div{background:var(--fill);border-radius:var(--r-sm);padding:13px 16px}
.hyp .k{font-size:var(--fs-8);letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-2);font-weight:700}
.hyp .s{font-size:var(--fs-2);font-weight:600;margin-top:4px;letter-spacing:-.02em;
  line-height:1.15}
.verdict{margin:0 18px 16px;border-radius:var(--r-sm);padding:13px 16px;line-height:1.4}
.verdict b{display:block;font-size:var(--fs-4);font-weight:700}
.verdict span{display:block;font-size:var(--fs-7);margin-top:2px;opacity:.85}
.verdict.rej{background:var(--warn-bg);color:var(--warn)}
.verdict.keep{background:var(--good-bg);color:var(--good)}
@media (max-width:560px){ .hyp{grid-template-columns:1fr} }

/* ---------- segmented control ---------- */
.segwrap{overflow-x:auto;scrollbar-width:none;margin-bottom:26px;padding-bottom:2px}
.segwrap::-webkit-scrollbar{display:none}
.segmented{display:inline-flex;background:var(--fill);border-radius:13px;padding:4px;gap:0}
.segmented button{appearance:none;border:none;background:none;white-space:nowrap;
  padding:9px 17px;font:inherit;font-size:var(--fs-6);font-weight:600;color:var(--text-2);
  cursor:pointer;border-radius:10px;transition:color .25s var(--ease),background .25s var(--ease)}
.segmented button:hover{color:var(--text)}
.segmented button[aria-current="true"]{background:var(--card);color:var(--maroon);
  box-shadow:var(--shadow)}

/* ---------- stage heading ---------- */
h2{font-size:var(--fs-1);line-height:1.08;letter-spacing:-.035em;margin:0 0 10px;font-weight:700;
   text-wrap:balance}
@media (max-width:640px){ h2{font-size:var(--fs-2)} }
.lede{margin:0 0 26px;color:var(--text-2);max-width:62ch;font-size:var(--fs-4);line-height:1.6}
.lede b{color:var(--text);font-weight:600}
.eyebrow{display:none}

/* ---------- cards ---------- */
.lab{background:var(--card);border:1px solid var(--sep);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow)}
.lab + .lab{margin-top:16px}
.card-h{padding:15px 20px 13px;border-bottom:1px solid var(--sep-2);display:flex;
  align-items:center;gap:11px}
.card-h .dot{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;
  background:var(--maroon);color:#fff;font-size:var(--fs-7);font-weight:700;flex:none}
.card-h .ttl{font-size:var(--fs-4);font-weight:600;letter-spacing:-.01em}
.card-h .right{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){ .card-h{flex-wrap:wrap} .card-h .right{margin-left:0;width:100%} }
.figwrap{padding:14px 16px 6px;min-width:0;position:relative}
.panel{display:grid;grid-template-columns:minmax(0,1fr) 216px}
.panel > .figwrap{display:flex;flex-direction:column;justify-content:center}
@media (max-width:780px){ .panel{grid-template-columns:minmax(0,1fr)} }
.side{border-left:1px solid var(--sep-2);background:var(--bg-2);padding:14px 15px;
  display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:780px){ .side{border-left:0;border-top:1px solid var(--sep-2)} }
.side .ctrl{background:var(--card);padding:10px 12px}
.side .btnrow{gap:6px}
.side .btnrow button.b{flex:1 1 46px;padding:7px 10px;text-align:center}
.sstat{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding-bottom:8px;border-bottom:1px solid var(--sep-2)}
.sstat:last-child{border-bottom:0;padding-bottom:0}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.statgrid .sstat{flex-direction:column;align-items:flex-start;gap:1px;border-bottom:0;padding-bottom:0}
.statgrid .sstat .v{font-size:var(--fs-5)}
.sstat .k{color:var(--text-3);font-weight:600;font-size:var(--fs-7)}
.sstat .v{font-weight:700;font-size:var(--fs-4);letter-spacing:-.02em}
.sstat .v.curve{color:var(--curve)} .sstat .v.sim{color:var(--sim)} .sstat .v.samp{color:var(--samp)}
canvas{display:block;width:100%;height:auto;max-width:100%;border-radius:var(--r-sm);touch-action:none}
.cap{padding:0 20px 14px;color:var(--text-2);font-size:var(--fs-7)}

.tip{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-116%);
  background:var(--text);color:var(--bg);font-size:var(--fs-7);font-weight:500;line-height:1.35;
  padding:7px 10px;border-radius:9px;white-space:nowrap;transition:opacity .12s;z-index:5;
  box-shadow:var(--shadow-lg)}
.tip.on{opacity:1}

/* ---------- control strip ---------- */
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;
  padding:16px 16px 18px;border-top:1px solid var(--sep-2);background:var(--bg-2)}
.ctrl{background:var(--card);border:1px solid var(--sep-2);border-radius:var(--r-sm);
  padding:12px 14px;min-width:0}
.ctrl label{display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  font-size:var(--fs-7);letter-spacing:.02em;color:var(--text-3);font-weight:600}
.ctrl label .v{font-size:var(--fs-6);letter-spacing:0;text-transform:none;color:var(--maroon);
  font-weight:700}
input[type=range]{width:100%;margin:10px 0 0;accent-color:var(--maroon);height:4px}
button.b{font:inherit;font-size:var(--fs-6);font-weight:600;cursor:pointer;border-radius:999px;
  border:1px solid var(--sep);background:var(--card);color:var(--text);padding:8px 15px;
  transition:all .18s var(--ease)}
button.b:hover{border-color:var(--maroon);color:var(--maroon)}
button.b:active{transform:scale(.97)}
button.b.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
button.b.big{background:var(--maroon);border-color:var(--maroon);color:#fff;font-weight:700}
button.b.big:hover{opacity:.88;color:#fff}
.btnrow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
select{font:inherit;font-size:var(--fs-6);padding:9px 11px;border-radius:10px;
  border:1px solid var(--sep);background:var(--card);color:var(--text);width:100%;margin-top:9px}
:focus-visible{outline:2.5px solid var(--maroon);outline-offset:2px}

/* ---------- readout tiles ---------- */
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;
  padding:14px 16px;border-top:1px solid var(--sep-2)}
.ro{background:var(--fill);border-radius:var(--r-sm);padding:13px 15px;min-width:0}
.ro .k{font-size:var(--fs-7);letter-spacing:.02em;color:var(--text-3);font-weight:600}
.ro .v{font-size:var(--fs-3);font-weight:700;line-height:1.15;margin-top:4px;letter-spacing:-.02em;
  transition:color .2s}
.ro .v.curve{color:var(--curve)} .ro .v.sim{color:var(--sim)} .ro .v.samp{color:var(--samp)}
.ro .v.good{color:var(--good)} .ro .v.bad{color:var(--bad)} .ro .v.warn{color:var(--warn)}
.ro .v.sm{font-size:var(--fs-4)}
.ro .v.curve.sm{font-size:var(--fs-4)}

.legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:2px 20px 14px;font-size:var(--fs-7);
  color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:14px;height:4px;border-radius:2px;display:inline-block}
.legend i.box{width:12px;height:12px;border-radius:3px}
code{font-family:var(--mono);font-size:.88em;background:var(--fill);padding:.12em .36em;border-radius:5px}

/* ---------- flow chart ---------- */
.flowwrap{padding:20px 16px 8px}
.flowrow{margin-bottom:4px}
.flowq{display:flex;align-items:center;gap:9px;font-size:var(--fs-8);letter-spacing:.09em;
  text-transform:uppercase;font-weight:700;color:var(--text-3);margin-bottom:11px}
.flowq .num{width:19px;height:19px;border-radius:50%;background:var(--gold);color:#fff;
  display:grid;place-items:center;font-size:10px;letter-spacing:0}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.node{appearance:none;text-align:left;background:var(--fill);border:1px solid transparent;
  border-radius:var(--r-sm);padding:14px 15px;cursor:pointer;font:inherit;color:var(--text);
  font-weight:600;font-size:var(--fs-6);line-height:1.3;flex:1 1 200px;min-width:0;
  display:flex;gap:11px;align-items:flex-start;transition:all .18s var(--ease)}
.node small{display:block;color:var(--text-2);font-size:var(--fs-7);font-weight:400;margin-top:3px}
.node .ico{flex:none;width:32px;height:24px;color:var(--text-3)}
.node:hover{background:var(--fill-2)}
.node[aria-pressed="true"]{background:var(--card);border-color:var(--maroon);color:var(--maroon);
  box-shadow:var(--shadow)}
.node[aria-pressed="true"] .ico{color:var(--maroon)}
.node[aria-pressed="true"] small{color:var(--text-2)}
.connector{height:20px;margin-left:9px;border-left:2px dotted var(--sep);
  animation:riseIn .32s var(--ease) both}
.connector.lit{border-left-color:var(--maroon)}
@keyframes riseIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

.result{border-top:1px solid var(--sep-2);background:var(--maroon);color:#fff;padding:22px 20px;
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;
  animation:riseIn .35s var(--ease) both}
@media (max-width:640px){ .result{grid-template-columns:minmax(0,1fr)} }
.result .tag{font-size:var(--fs-8);letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.65);font-weight:700}
.result .rname{font-size:var(--fs-2);font-weight:700;letter-spacing:-.03em;margin-top:5px;line-height:1.1}
.result .rwhen{color:rgba(255,255,255,.80);font-size:var(--fs-6);margin-top:8px;max-width:54ch}
.result .rcode{margin-top:14px;font-family:var(--mono);font-size:var(--fs-code);
  background:rgba(0,0,0,.26);border-radius:10px;padding:11px 14px;overflow-x:auto;
  white-space:pre;color:#fff}
.result .rmeta{margin-top:12px;font-size:var(--fs-7);color:rgba(255,255,255,.78);
  display:flex;gap:6px 18px;flex-wrap:wrap}
.result .rmeta b{color:#fff;font-weight:700}
.result .curvecard{background:rgba(255,255,255,.10);border-radius:var(--r-sm);padding:13px;
  width:180px;max-width:100%}
.result .curvecard .lbl{font-size:var(--fs-8);letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.65);font-weight:700;margin-bottom:7px;text-align:center}
.testdetail{padding:18px 20px 20px;border-top:1px solid var(--sep-2);background:var(--bg-2)}
.statline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;background:var(--card);
  border:1px solid var(--sep-2);border-radius:var(--r-sm);padding:12px 15px;margin-bottom:12px}
.statline .k{font-size:var(--fs-8);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);
  font-weight:700;flex:none}
.statline .f{font-size:var(--fs-4);font-weight:600;letter-spacing:-.01em;min-width:0}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:720px){ .twocol{grid-template-columns:1fr} }
.dcard{background:var(--card);border:1px solid var(--sep-2);border-radius:var(--r-sm);padding:14px 16px;
  min-width:0}
.dcard h4{margin:0 0 6px;font-size:var(--fs-8);letter-spacing:.09em;text-transform:uppercase;
  color:var(--maroon);font-weight:700}
.dcard p{margin:0;font-size:var(--fs-6);color:var(--text-2);line-height:1.55}
.dcard p b{color:var(--text);font-weight:700}
ol.steps{margin:0;padding-left:19px}
ol.steps li{font-size:var(--fs-6);color:var(--text-2);line-height:1.5;margin-bottom:5px}
ol.steps li::marker{color:var(--gold-2);font-weight:700}
ol.steps code,.outrow code{font-family:var(--mono);font-size:var(--fs-7);background:var(--fill);
  padding:.1em .34em;border-radius:5px;color:var(--text)}
.dcard .assume{margin-top:9px;padding-top:9px;border-top:1px solid var(--sep-2);
  font-size:var(--fs-7);color:var(--text-3)}
.dcard .assume b{color:var(--text-2)}
.outlist{display:grid;gap:8px}
.outrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline}
.outrow code{white-space:nowrap;color:var(--maroon);font-weight:500;background:var(--maroon-tint,var(--fill))}
.outrow span{font-size:var(--fs-6);color:var(--text-2);line-height:1.5}
.outrow span b{color:var(--text)}
.sayit{margin:12px 0 0;background:var(--card);border:1px solid var(--sep-2);border-radius:var(--r-sm);
  padding:12px 15px;font-size:var(--fs-6);color:var(--text-2);line-height:1.5}
.sayit b{color:var(--maroon);font-weight:700}
.empty{padding:28px 20px;color:var(--text-3);font-size:var(--fs-6);text-align:center;
  border-top:1px solid var(--sep-2);background:var(--bg-2)}

/* ---------- resource lists ---------- */
.reslist{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px;
  padding:16px 18px 20px}
.rescard{display:grid;gap:3px;background:var(--fill);border:1px solid transparent;
  border-radius:var(--r-sm);padding:14px 16px;text-decoration:none;color:inherit;min-width:0;
  transition:all .18s var(--ease)}
.rescard:hover{background:var(--card);border-color:var(--maroon);box-shadow:var(--shadow)}
.rsrc{font-size:var(--fs-8);letter-spacing:.1em;text-transform:uppercase;color:var(--gold-2);
  font-weight:700}
.rttl{font-size:var(--fs-5);font-weight:600;letter-spacing:-.01em;line-height:1.3}
.rescard:hover .rttl{color:var(--maroon)}
.rnote{font-size:var(--fs-7);color:var(--text-2);line-height:1.5;margin-top:2px}
.rgo{font-size:var(--fs-8);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--maroon);margin-top:6px}
.restail{padding:16px 18px 20px}
.restail p{margin:0 0 10px;font-size:var(--fs-6);color:var(--text-2);line-height:1.6;max-width:78ch}
.restail p:last-child{margin-bottom:0}

<body>
<div class="wrap">
  <header class="mast">

  </header>
  <div class="segwrap"><div class="segmented" id="nav"></div></div>
  <main id="stage"></main>

<script>
/* ============================================================ harness */
const el=(t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=(v,d=2)=>Number.isFinite(v)?v.toFixed(d):"—";
const sum=a=>a.reduce((x,y)=>x+y,0);
const mean=a=>sum(a)/a.length;
function sdS(a){const m=mean(a);return Math.sqrt(sum(a.map(x=>(x-m)*(x-m)))/(a.length-1));}
function sdP(a){const m=mean(a);return Math.sqrt(sum(a.map(x=>(x-m)*(x-m)))/a.length);}
function quant(a,p){const b=a.slice().sort((x,y)=>x-y),h=(b.length-1)*p,lo=Math.floor(h),hi=Math.ceil(h);
  return b[lo]+(b[hi]-b[lo])*(h-lo);}
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const REDUCED=matchMedia("(prefers-reduced-motion:reduce)").matches;

/* the only distribution maths this page needs */
function lgamma(x){
  const g=[676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,
    12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(x<0.5) return Math.log(Math.PI/Math.sin(Math.PI*x))-lgamma(1-x);
  x-=1; let a=0.99999999999980993,t=x+7.5;
  for(let i=0;i<8;i++) a+=g[i]/(x+i+1);
  return 0.5*Math.log(2*Math.PI)+(x+0.5)*Math.log(t)-t+Math.log(a);
}
function gammaP(a,x){
  if(x<=0) return 0;
  if(x<a+1){ let ap=a,s=1/a,d=s;
    for(let n=1;n<300;n++){ap++;d*=x/ap;s+=d;if(Math.abs(d)<Math.abs(s)*1e-15)break;}
    return s*Math.exp(-x+a*Math.log(x)-lgamma(a)); }
  const FP=1e-300,EPS=1e-15; let b=x+1-a,c=1/FP,d=1/b,h=d;
  for(let i=1;i<300;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<FP)d=FP;
    c=b+an/c;if(Math.abs(c)<FP)c=FP;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<EPS)break;}
  return 1-Math.exp(-x+a*Math.log(x)-lgamma(a))*h;
}
const erf=x=>(x<0?-1:1)*gammaP(0.5,x*x);
const normPdf=x=>Math.exp(-0.5*x*x)/Math.sqrt(2*Math.PI);
const normCdf=x=>0.5*(1+erf(x/Math.SQRT2));
function invert(cdf,p,lo,hi){for(let i=0;i<200;i++){const m=(lo+hi)/2;if(cdf(m)<p)lo=m;else hi=m;}return (lo+hi)/2;}
const zCrit=p=>invert(normCdf,p,-40,40);

/* ---------- canvas with a hover layer ---------- */
function makeCanvas(host,aspect,draw,hover){
  const c=el("canvas"); host.append(c);
  const ctx=c.getContext("2d");
  let W=0,H=0;
  function size(){
    const w=c.clientWidth||host.clientWidth||640,
          h=Math.round(typeof aspect==='function'?aspect(w):w*aspect);
    const dpr=Math.min(window.devicePixelRatio||1,2);
    c.width=Math.round(w*dpr); c.height=Math.round(h*dpr); c.style.height=h+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0); W=w; H=h;
  }
  const api={c,ctx,get w(){return W;},get h(){return H;},
    render(){ size(); ctx.clearRect(0,0,W,H); draw(ctx,W,H); }};
  let lastW=-1, queued=false;
  new ResizeObserver(()=>{
    if(queued) return; queued=true;
    requestAnimationFrame(()=>{
      queued=false;
      const w=c.clientWidth||host.clientWidth||0;
      if(w===lastW) return;      /* only a height change we caused ourselves */
      lastW=w; api.render();
    });
  }).observe(c);
  matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>api.render());
  if(hover){
    const tip=el("div","tip"); host.append(tip);
    const place=(x,y,html)=>{ if(html==null){tip.classList.remove("on");return;}
      tip.innerHTML=html; tip.classList.add("on");
      tip.style.left=clamp(x,60,host.clientWidth-60)+"px"; tip.style.top=y+"px"; };
    c.addEventListener("pointermove",e=>{
      const r=c.getBoundingClientRect();
      hover(e.clientX-r.left,e.clientY-r.top,place,W,H);
    });
    c.addEventListener("pointerleave",()=>tip.classList.remove("on"));
  }
  return api;
}
/* a tween that respects reduced motion */
function tween(ms,step,done){
  if(REDUCED){ step(1); if(done) done(); return; }
  const t0=performance.now();
  (function frame(t){
    const k=clamp((t-t0)/ms,0,1);
    step(k<1 ? 1-Math.pow(1-k,3) : 1);
    if(k<1) requestAnimationFrame(frame); else if(done) done();
  })(t0);
}
function slider(host,{label,min,max,step,value,fmt:f=v=>v,on}){
  const w=el("div","ctrl"), l=el("label"); l.append(el("span",null,label));
  const val=el("span","v",f(value)); l.append(val);
  const i=document.createElement("input");
  i.type="range"; i.min=min; i.max=max; i.step=step; i.value=value;
  i.id="s"+Math.random().toString(36).slice(2,8); l.setAttribute("for",i.id);
  i.addEventListener("input",()=>{val.textContent=f(+i.value);on(+i.value);});
  w.append(l,i); host.append(w);
  return {input:i,set(v){i.value=v;val.textContent=f(+v);}};
}
function picker(host,{label,options,value,on}){
  const w=el("div","ctrl"), l=el("label"); l.append(el("span",null,label)); w.append(l);
  const s=document.createElement("select");
  s.id="p"+Math.random().toString(36).slice(2,8); l.setAttribute("for",s.id);
  options.forEach(([v,t])=>{const o=document.createElement("option");o.value=v;o.textContent=t;
    if(v===value)o.selected=true;s.append(o);});
  s.addEventListener("change",()=>on(s.value));
  w.append(s); host.append(w); return s;
}
function buttons(host,label,items){
  const w=el("div","ctrl"); if(label){const l=el("label");l.append(el("span",null,label));w.append(l);}
  const r=el("div","btnrow"); r.style.marginTop="7px";
  items.forEach(it=>{const b=el("button","b"+(it.big?" big":""),it.t);
    b.addEventListener("click",()=>it.on(b)); r.append(b); it.el=b;});
  w.append(r); host.append(w); return items;
}
function readouts(host,keys){
  const w=el("div","readout"), out={};
  keys.forEach(([k,label,cls])=>{
    const d=el("div","ro"); d.append(el("div","k",label));
    const v=el("div","v"+(cls?" "+cls:""),"—"); d.append(v); out[k]=v; w.append(d);
  });
  host.append(w); return out;
}
function legend(host,items){
  const w=el("div","legend");
  items.forEach(([color,text,kind])=>{const s=el("span"); const i=el("i",kind||"");
    i.style.background=color; s.append(i,document.createTextNode(text)); w.append(s);});
  host.append(w);
}
function panel(lab){
  const p=el("div","panel"), fig=el("div","figwrap"), side=el("div","side");
  p.append(fig,side); lab.append(p); return {fig,side};
}
function sideStats(side,keys,grid){
  const out={};
  const host=grid?el("div","statgrid"):side;
  if(grid) side.append(host);
  keys.forEach(([k,label,cls])=>{
    const r=el("div","sstat");
    r.append(el("span","k",label));
    const v=el("span","v"+(cls?" "+cls:""),"\u2014");
    r.append(v); out[k]=v; host.append(r);
  });
  return out;
}
function sect(lab,num,title){
  const h=el("div","card-h"); h.append(el("span","dot",String(num)));
  h.append(el("span","ttl",title)); lab.append(h); return h;
}
/* rounded-top bar, 2px gap, anchored to the baseline */
function roundBar(ctx,x,y,w,h,r,fill,stroke){
  if(h<=0.5) return;
  const rr=Math.min(r,w/2,h);
  ctx.beginPath();
  ctx.moveTo(x,y+h); ctx.lineTo(x,y+rr);
  ctx.quadraticCurveTo(x,y,x+rr,y);
  ctx.lineTo(x+w-rr,y); ctx.quadraticCurveTo(x+w,y,x+w,y+rr);
  ctx.lineTo(x+w,y+h); ctx.closePath();
  ctx.fillStyle=fill; ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke();}
}
function frame(ctx,w,h,m,xd,yd){
  const L=m[3],R=w-m[1],T=m[0],B=h-m[2];
  const X=v=>L+(v-xd[0])/(xd[1]-xd[0])*(R-L);
  const Y=v=>B-(v-yd[0])/(yd[1]-yd[0])*(B-T);
  const api={L,R,T,B,X,Y,xd,yd,
    grid(nx,ny,labx,laby){
      ctx.strokeStyle=css("--grid"); ctx.lineWidth=1; ctx.fillStyle=css("--text-2");
      ctx.font='11.5px "Commissioner",sans-serif';
      for(let i=0;i<=ny;i++){const v=yd[0]+(yd[1]-yd[0])*i/ny,y=Y(v);
        ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(R,y);ctx.stroke();
        if(laby){ctx.textAlign="right";ctx.textBaseline="middle";ctx.fillText(laby(v),L-8,y);}}
      for(let i=0;i<=nx;i++){const v=xd[0]+(xd[1]-xd[0])*i/nx,x=X(v);
        if(labx){ctx.textAlign="center";ctx.textBaseline="top";ctx.fillText(labx(v),x,B+8);}}
      ctx.strokeStyle=css("--line"); ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(L,B+.5); ctx.lineTo(R,B+.5); ctx.stroke();
    },
    axisLabel(xt){ctx.fillStyle=css("--text-2");ctx.font='600 11.5px "Commissioner",sans-serif';
      ctx.textAlign="center";ctx.textBaseline="bottom";if(xt)ctx.fillText(xt,(L+R)/2,h-2);},
    clipIn(fn){ctx.save();ctx.beginPath();ctx.rect(L-1,T-30,R-L+2,B-T+32);ctx.clip();fn();ctx.restore();},
    vline(x,color,width,dash){ctx.save();ctx.beginPath();ctx.setLineDash(dash||[]);
      ctx.moveTo(X(x),T);ctx.lineTo(X(x),B);ctx.strokeStyle=color;ctx.lineWidth=width||1.6;
      ctx.stroke();ctx.restore();},
    tag(x,text,color,yoff){
      ctx.font='700 11px "Commissioner",sans-serif';
      const wd=ctx.measureText(text).width, px=clamp(X(x),L+wd/2+6,R-wd/2-6), py=T+(yoff||2);
      ctx.fillStyle=css("--card"); ctx.globalAlpha=.85;
      ctx.fillRect(px-wd/2-5,py-1,wd+10,15); ctx.globalAlpha=1;
      ctx.fillStyle=color; ctx.textAlign="center"; ctx.textBaseline="top"; ctx.fillText(text,px,py);},
    line(pts,color,width,dash){ctx.save();ctx.beginPath();ctx.setLineDash(dash||[]);
      pts.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));
      ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineJoin="round";ctx.lineCap="round";
      ctx.stroke();ctx.restore();},
    area(pts,fill){if(!pts.length)return;ctx.save();ctx.beginPath();
      ctx.moveTo(X(pts[0][0]),Y(0));pts.forEach(p=>ctx.lineTo(X(p[0]),Y(p[1])));
      ctx.lineTo(X(pts[pts.length-1][0]),Y(0));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.restore();},
    fade(pts,c1,c2){ if(!pts.length) return; const g=ctx.createLinearGradient(0,T,0,B);
      g.addColorStop(0,c1); g.addColorStop(1,c2); api.area(pts,g); },
    hist(vals,lo,hi,bins,fill,stroke,scale){
      const counts=new Array(bins).fill(0), wd=(hi-lo)/bins;
      vals.forEach(v=>{if(v>=lo&&v<hi)counts[Math.floor((v-lo)/wd)]++;});
      const n=vals.length||1;
      api.clipIn(()=>{for(let i=0;i<bins;i++){
        const d=counts[i]/(n*wd); if(d<=0) continue;
        const x0=X(lo+i*wd), x1=X(lo+(i+1)*wd), yT=Y(d*(scale==null?1:scale));
        roundBar(ctx,x0+1,yT,Math.max(1.5,x1-x0-2),Y(0)-yT,4,fill,stroke);
      }});
      return {counts,width:wd,peak:Math.max(...counts.map(c=>c/(n*wd)))};
    }};
  return api;
}
function tint(tok,a){
  const h=css(tok).replace("#","");
  const n=h.length===3?h.split("").map(c=>parseInt(c+c,16)):[0,2,4].map(i=>parseInt(h.slice(i,i+2),16));
  return "rgba("+n[0]+","+n[1]+","+n[2]+","+Math.max(0,Math.min(1,a)).toFixed(3)+")";
}
const curvePts=(f,lo,hi,steps)=>{const p=[];for(let i=0;i<=steps;i++){const x=lo+(hi-lo)*i/steps;p.push([x,f(x)]);}return p;};
const MODULES=[];
</script>

<script>
/* ============================================================ 1. sampling distributions */
MODULES.push({
 name:"Sampling distribution",
 title:"Draw one sample. Then draw a thousand.",
 lede:"Pick a population, take a sample of size n, compute a statistic. Do it again and the "+
      "statistic comes out different. <b>The pile those repeats make is the sampling "+
      "distribution</b>, and every p-value is read off it.",
 build(host){
  let shape="skew", n=10, stat="mean", showCurve=true;
  let pop=[], last=[], draws=[], seed=1, dropK=1, sampleK=1, lastStat=null;

  function buildPop(){
    const r=rng(20260420), out=[];
    for(let i=0;i<5000;i++){
      if(shape==="normal")       out.push(50+10*gauss(r));
      else if(shape==="uniform") out.push(20+60*r());
      else if(shape==="skew")    out.push(20+Math.exp(1.0+0.58*gauss(r))*6);
      else                       out.push(r()<0.5 ? 32+6*gauss(r) : 68+6*gauss(r));
    }
    pop=out;
  }
  const statOf=s=> stat==="mean"?mean(s) : stat==="sd"?sdS(s) : quant(s,0.5);
  const statName=()=> stat==="mean"?"sample mean" : stat==="sd"?"sample sd" : "sample median";
  const statSym=()=> stat==="mean"?"mean" : stat==="sd"?"s" : "median";
  const lo=()=>Math.min(...pop), hi=()=>Math.max(...pop);

  function drawSample(){ const r=rng(seed++), s=[];
    for(let i=0;i<n;i++) s.push(pop[Math.floor(r()*pop.length)%pop.length]); return s; }
  function take(k){
    for(let i=0;i<k;i++){ last=drawSample(); lastStat=statOf(last); draws.push(lastStat); }
    paint();
    sampleK=0; dropK=0;
    tween(k>1?400:580,t=>{ sampleK=t; dropK=t; cv2.render(); cv3.render(); });
  }

  /* ---------- 1 - population ---------- */
  const lab1=el("div","lab"); sect(lab1,1,"The population");
  const p1=panel(lab1);
  const cv1=makeCanvas(p1.fig,0.30,(c,W,H)=>{
    const L=lo(),Hh=hi(),bins=46,wd=(Hh-L)/bins,cnt=new Array(bins).fill(0);
    pop.forEach(v=>cnt[clamp(Math.floor((v-L)/wd),0,bins-1)]++);
    const dens=cnt.map(x=>x/(pop.length*wd));
    const fr=frame(c,W,H,[14,14,30,38],[L,Hh],[0,Math.max(...dens)*1.18]);
    fr.grid(5,0,x=>x.toFixed(0),null);
    fr.clipIn(()=>{ for(let i=0;i<bins;i++){ if(!dens[i])continue;
      const x0=fr.X(L+i*wd),x1=fr.X(L+(i+1)*wd),yT=fr.Y(dens[i]);
      roundBar(c,x0+1,yT,Math.max(1.5,x1-x0-2),fr.Y(0)-yT,3,tint("--curve",0.30),null); }});
    fr.vline(mean(pop),css("--curve"),2,[6,4]);
    fr.tag(mean(pop),"\u03bc = "+fmt(mean(pop),1),css("--curve"),0);
  });
  picker(p1.side,{label:"Population distribution is",value:"skew",options:[
    ["normal","Normal"],["uniform","Uniform"],["skew","Skewed"],["bimodal","Bimodal"]],
    on:v=>{shape=v;draws=[];last=[];lastStat=null;paint();}});
  const ro1=sideStats(p1.side,[["mu","population mean \u03bc","curve"],
    ["sg","population sd \u03c3","curve"]]);
  host.append(lab1);

  /* ---------- 2 - one sample ---------- */
  const lab2=el("div","lab"); sect(lab2,2,"One random sample of size n");
  const p2=panel(lab2);
  const cv2=makeCanvas(p2.fig,0.21,(c,W,H)=>{
    const fr=frame(c,W,H,[14,14,30,38],[lo(),hi()],[0,1]);
    fr.grid(5,0,x=>x.toFixed(0),null);
    if(!last.length){
      c.fillStyle=css("--text-3"); c.font='13px "Commissioner",sans-serif';
      c.textAlign="center"; c.textBaseline="middle";
      c.fillText("Draw a sample \u2192",(fr.L+fr.R)/2,(fr.T+fr.B)/2); return;
    }
    fr.clipIn(()=>{
      const used={};
      last.forEach((v,i)=>{
        const show=clamp(sampleK*last.length-i,0,1); if(show<=0) return;
        const x=Math.round(fr.X(v)); used[x]=(used[x]||0)+1;
        const y=fr.B-8-(used[x]-1)*8;
        c.globalAlpha=show;
        c.beginPath(); c.arc(x,y-(1-show)*22,4.2*(0.5+0.5*show),0,7);
        c.fillStyle=tint("--samp",0.55); c.fill();
        c.strokeStyle=css("--samp"); c.lineWidth=1.3; c.stroke();
        c.globalAlpha=1;
      });
    });
    const m=statOf(last);
    if(stat!=="sd"){ fr.vline(m,css("--sim"),2.4); fr.tag(m,statSym()+" = "+fmt(m,1),css("--sim"),0); }
  });
  slider(p2.side,{label:"Sample size n",min:2,max:100,step:1,value:10,
    on:v=>{n=v;draws=[];last=[];lastStat=null;paint();}});
  const ro2=sideStats(p2.side,[["sm","this sample's statistic","sim"],
    ["sx","its mean","samp"],["ss","its sd","samp"]]);
  host.append(lab2);

  /* ---------- 3 - the sampling distribution ---------- */
  const lab3=el("div","lab"); sect(lab3,3,"Approximate sampling distribution");
  const p3=panel(lab3);
  let lastFrame=null;
  const cv3=makeCanvas(p3.fig,0.36,(c,W,H)=>{
    if(!draws.length){
      const fr=frame(c,W,H,[14,14,32,38],[0,1],[0,1]); fr.grid(4,3,null,null);
      c.fillStyle=css("--text-3"); c.font='13px "Commissioner",sans-serif';
      c.textAlign="center"; c.textBaseline="middle";
      c.fillText("Their "+statName()+"s pile up here.",(fr.L+fr.R)/2,(fr.T+fr.B)/2);
      lastFrame=null; return;
    }
    const m=mean(draws), s=(draws.length>1?sdS(draws):1)||1;
    const a=Math.min(...draws), b=Math.max(...draws);
    const pad=(b-a)*0.14+s*0.5, L=a-pad, Hh=b+pad;
    const probe=frame(c,W,H,[14,14,32,38],[L,Hh],[0,1]);
    const peak=probe.hist(draws,L,Hh,30,"rgba(0,0,0,0)",null).peak;
    const top=Math.max(peak,showCurve?normPdf(0)/s:0)*1.22||1;
    const fr=frame(c,W,H,[14,14,32,38],[L,Hh],[0,top]);
    fr.grid(5,3,x=>x.toFixed(1),null);
    const info=fr.hist(draws,L,Hh,30,tint("--sim",0.42),css("--sim"));
    if(showCurve) fr.clipIn(()=>{
      fr.fade(curvePts(x=>normPdf((x-m)/s)/s,L,Hh,220),tint("--curve",0.16),tint("--curve",0.02));
      fr.line(curvePts(x=>normPdf((x-m)/s)/s,L,Hh,220),css("--curve"),2.4);
    });
    fr.vline(m,css("--sim"),1.8,[6,4]);
    if(lastStat!=null && dropK<1){
      const x=fr.X(lastStat), y=fr.T+(fr.B-fr.T)*dropK;
      c.globalAlpha=1-dropK*0.2;
      c.beginPath(); c.arc(x,y,6.5,0,7); c.fillStyle=css("--samp"); c.fill();
      c.strokeStyle=css("--card"); c.lineWidth=2; c.stroke(); c.globalAlpha=1;
    }
    lastFrame={fr,L,Hh,info};
  },(mx,my,place)=>{
    if(!lastFrame) return place(null);
    const {fr,L,Hh,info}=lastFrame;
    if(mx<fr.L||mx>fr.R||my<fr.T||my>fr.B) return place(null);
    const v=L+(mx-fr.L)/(fr.R-fr.L)*(Hh-L);
    const i=clamp(Math.floor((v-L)/info.width),0,info.counts.length-1);
    place(mx,my,"<b>"+info.counts[i]+"</b> of "+draws.length+" samples<br>"+
      fmt(L+i*info.width,2)+" to "+fmt(L+(i+1)*info.width,2));
  });
  picker(p3.side,{label:"Sampling distribution of",value:"mean",options:[
    ["mean","the sample mean"],["sd","the sample standard deviation"],["median","the sample median"]],
    on:v=>{stat=v;draws=[];lastStat=null;paint();}});
  const drawBox=el("div","ctrl");
  drawBox.append(el("label",null,"<span>Draw random samples</span>"));
  const row=el("div","btnrow"); row.style.marginTop="8px";
  [["1",()=>take(1)],["10",()=>take(10)],["100",()=>take(100)],["1,000",()=>take(1000)],
   ["Reset",()=>{draws=[];last=[];lastStat=null;seed=1;paint();}]]
   .forEach(([t,fn])=>{ const b=el("button","b"+(t==="1,000"?" big":""),t);
     b.addEventListener("click",fn); row.append(b); });
  drawBox.append(row); p3.side.append(drawBox);
  const ro3=sideStats(p3.side,[["k","samples","sim"],["dm","centre","sim"],
    ["ds","spread","sim"],["pr","\u03c3/\u221an","curve"]],true);
  const curveBtn=el("button","b on","Normal curve");
  curveBtn.style.marginTop="2px";
  curveBtn.addEventListener("click",()=>{showCurve=!showCurve;
    curveBtn.classList.toggle("on",showCurve); cv3.render();});
  p3.side.append(curveBtn);
  host.append(lab3);

  function paint(){
    buildPop(); cv1.render(); cv2.render(); cv3.render();
    ro1.mu.textContent=fmt(mean(pop),2);
    ro1.sg.textContent=fmt(sdP(pop),2);
    ro2.sm.textContent=last.length?fmt(statOf(last),2):"\u2014";
    ro2.sx.textContent=last.length?fmt(mean(last),2):"\u2014";
    ro2.ss.textContent=last.length?fmt(sdS(last),2):"\u2014";
    ro3.k.textContent=draws.length.toLocaleString();
    ro3.dm.textContent=draws.length?fmt(mean(draws),2):"\u2014";
    ro3.ds.textContent=draws.length>1?fmt(sdS(draws),3):"\u2014";
    ro3.pr.textContent=stat==="mean"?fmt(sdP(pop)/Math.sqrt(n),3):"\u2014";
  }
  paint();
 }
});
</script>

<script>
/* ============================================================ 2. one-sample t-test */
/* Student's t, written out here because this stage is the only one that needs it */
function betacf(a,b,x){
  const FP=1e-300,EPS=1e-15; let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;
  if(Math.abs(d)<FP)d=FP; d=1/d; let h=d;
  for(let m=1;m<=300;m++){
    const m2=2*m; let aa=m*(b-m)*x/((qam+m2)*(a+m2));
    d=1+aa*d; if(Math.abs(d)<FP)d=FP; c=1+aa/c; if(Math.abs(c)<FP)c=FP; d=1/d; h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
    d=1+aa*d; if(Math.abs(d)<FP)d=FP; c=1+aa/c; if(Math.abs(c)<FP)c=FP; d=1/d;
    const del=d*c; h*=del; if(Math.abs(del-1)<EPS) break;
  }
  return h;
}
function betaI(a,b,x){
  if(x<=0) return 0; if(x>=1) return 1;
  const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));
  return x<(a+1)/(a+b+2) ? bt*betacf(a,b,x)/a : 1-bt*betacf(b,a,1-x)/b;
}
const tPdf=(t,v)=>Math.exp(lgamma((v+1)/2)-lgamma(v/2))/Math.sqrt(v*Math.PI)*Math.pow(1+t*t/v,-(v+1)/2);
function tCdf(t,v){ const p=0.5*betaI(v/2,0.5,v/(v+t*t)); return t>0?1-p:p; }
const tCrit=(p,v)=>invert(x=>tCdf(x,v),p,-60,60);

MODULES.push({
 name:"One-sample t-test",
 title:"One sample, one claim, one decision",
 lede:"A population sits out there with a mean you cannot see. You take one sample and you have a "+
      "claim about that unseen mean. Move the value you are testing against and watch everything "+
      "else follow — the statistic, the rejection region, the p-value and the verdict are one "+
      "calculation seen from four sides.",
 build(host){
  let mu=52, sigma=10, n=25, mu0=50, tail="two", alpha=0.05, seed=7;
  let z=[];
  const redraw=()=>{const r=rng(seed); z=Array.from({length:200},()=>gauss(r));};
  redraw();
  const samp=()=>z.slice(0,n).map(v=>mu+sigma*v);
  function stats(){
    const x=samp(), xb=mean(x), s=sdS(x), df=n-1, se=s/Math.sqrt(n);
    const t=(xb-mu0)/se;
    const p = tail==="two" ? 2*(1-tCdf(Math.abs(t),df))
            : tail==="gt"  ? 1-tCdf(t,df) : tCdf(t,df);
    const tc = tail==="two" ? tCrit(1-alpha/2,df) : tCrit(1-alpha,df);
    const half= tCrit(1-alpha/2,df)*se;
    return {x,xb,s,df,se,t,p,tc,half,lo:xb-half,hi:xb+half,rej:p<alpha};
  }
  /* one label style for every flag drawn on a chart */
  function flag(c,fr,x,text,colour,row){
    c.font='700 11.5px "Commissioner",sans-serif';
    const w=c.measureText(text).width;
    const px=clamp(fr.X(x),fr.L+w/2+6,fr.R-w/2-6), py=fr.T+2+row*17;
    c.strokeStyle=colour; c.lineWidth=1; c.setLineDash([2,3]);
    c.beginPath(); c.moveTo(fr.X(x),py+13); c.lineTo(fr.X(x),fr.B); c.stroke(); c.setLineDash([]);
    c.fillStyle=css("--card"); c.globalAlpha=.92;
    c.fillRect(px-w/2-6,py-2,w+12,16); c.globalAlpha=1;
    c.fillStyle=colour; c.textAlign="center"; c.textBaseline="top"; c.fillText(text,px,py);
  }

  /* ================= 1. population and sample ================= */
  const lab1=el("div","lab");
  sect(lab1,1,"The population you cannot see, and the sample you can");
  const fig1=el("div","figwrap"); lab1.append(fig1);
  const cv1=makeCanvas(fig1,w=>Math.max(w*0.34,250),(c,W,H)=>{
    const S=stats();
    const lo=Math.min(mu,S.xb)-3.2*sigma, hi=Math.max(mu,S.xb)+3.2*sigma;
    const fr=frame(c,W,H,[62,18,40,18],[lo,hi],[0,normPdf(0)/sigma*1.18]);
    fr.grid(6,0,v=>v.toFixed(0),null);
    fr.axisLabel("the measurement itself");
    const pop=curvePts(v=>normPdf((v-mu)/sigma)/sigma,lo,hi,320);
    fr.clipIn(()=>{
      fr.fade(pop,tint("--curve",0.26),tint("--curve",0.02));
      fr.line(pop,css("--curve"),2.6);
      const r2=rng(seed+991);
      S.x.forEach(v=>{ const y=fr.B-9-r2()*30;
        c.beginPath(); c.arc(fr.X(v),y,3.1,0,7); c.fillStyle=tint("--samp",0.75); c.fill(); });
    });
    flag(c,fr,S.xb,"x̄ = "+fmt(S.xb,2),css("--samp"),0);
    flag(c,fr,mu,"true μ = "+fmt(mu,1),css("--curve"),1);
  });
  legend(lab1,[[css("--curve"),"population"],[tint("--samp",0.85),"your n observations","dot"],
    [css("--samp"),"sample mean"]]);
  const r1=readouts(lab1,[["xb","sample mean","samp"],
    ["s","sample sd","sm"],["se","standard error","sm"],["n","sample size n","sm"],
    ["mu","true μ (simulation)","curve sm"]]);
  const c1=el("div","ctrls"); lab1.append(c1);
  slider(c1,{label:"Sample size n",min:5,max:120,step:1,value:25,on:v=>{n=v;go();}});
  slider(c1,{label:"True population mean μ · simulation only",min:40,max:64,step:0.5,
    value:52,fmt:v=>v.toFixed(1),on:v=>{mu=v;go();}});
  slider(c1,{label:"Population sd σ · simulation only",min:4,max:20,step:1,value:10,
    on:v=>{sigma=v;go();}});
  const bt=buttons(c1,null,
    [{t:"Draw a new sample from the same population",big:true,
      on:()=>{seed=(seed*7919+13)%99991;redraw();go();}}]);
  bt[0].el.closest(".ctrl").classList.add("wide");
  host.append(lab1);

  /* ================= 2. the hypotheses ================= */
  const lab2=el("div","lab");
  sect(lab2,2,"State the two hypotheses before you look");
  const hyp=el("div","hyp");
  const h0=el("div"), h1=el("div");
  h0.append(el("div","k","Null hypothesis H₀"));  const h0s=el("div","s"); h0.append(h0s);
  h1.append(el("div","k","Alternative H₁"));      const h1s=el("div","s"); h1.append(h1s);
  hyp.append(h0,h1); lab2.append(hyp);
  const hint=el("p","labnote"); lab2.append(hint);
  const c2=el("div","ctrls"); lab2.append(c2);
  const mu0A=slider(c2,{label:"The value you are testing against · μ₀",
    min:40,max:64,step:0.5,value:50,fmt:v=>v.toFixed(1),on:v=>{mu0=v;mu0B.set(v);go();}});
  mu0A.input.closest(".ctrl").classList.add("hero");
  picker(c2,{label:"Direction of H₁",value:"two",on:v=>{tail=v;go();},options:[
    ["two","Two-sided · μ ≠ μ₀"],
    ["gt","One-sided · μ > μ₀"],
    ["lt","One-sided · μ < μ₀"]]});
  picker(c2,{label:"Significance level α",value:"0.05",on:v=>{alpha=+v;go();},options:[
    ["0.10","0.10 · lenient"],["0.05","0.05 · the usual choice"],["0.01","0.01 · strict"]]});
  host.append(lab2);

  /* ================= 3. the test ================= */
  const lab3=el("div","lab");
  sect(lab3,3,"Where your t lands on the t distribution");
  const fig3=el("div","figwrap"); lab3.append(fig3);
  const cv3=makeCanvas(fig3,w=>Math.max(w*0.34,250),(c,W,H)=>{
    const S=stats();
    const span=Math.max(4.4,Math.abs(S.t)+1.2);
    const fr=frame(c,W,H,[62,18,40,18],[-span,span],[0,tPdf(0,S.df)*1.2]);
    fr.grid(6,0,v=>v.toFixed(0),null);
    fr.axisLabel("t · standard errors between x̄ and μ₀");
    const pts=curvePts(v=>tPdf(v,S.df),-span,span,340);
    fr.clipIn(()=>{
      if(tail!=="lt") fr.area(pts.filter(q=>q[0]>=S.tc),tint("--bad",0.42));
      if(tail!=="gt") fr.area(pts.filter(q=>q[0]<=-S.tc),tint("--bad",0.42));
      const a=tail==="two"?Math.abs(S.t):S.t;
      if(tail!=="lt") fr.area(pts.filter(q=>q[0]>=a),tint("--samp",0.55));
      if(tail!=="gt") fr.area(pts.filter(q=>q[0]<=(tail==="two"?-Math.abs(S.t):S.t)),tint("--samp",0.55));
      fr.line(pts,css("--curve"),2.8);
    });
    (tail==="two"?[-S.tc,S.tc]:tail==="gt"?[S.tc]:[-S.tc])
      .forEach(v=>flag(c,fr,v,(v<0?"−":"")+fmt(Math.abs(v),3),css("--bad"),0));
    flag(c,fr,S.t,"t = "+fmt(S.t,2),css("--samp"),1);
  });
  legend(lab3,[[tint("--bad",0.8),"rejection region · area α","box"],
    [tint("--samp",0.8),"p-value · area past your t","box"],
    [css("--curve"),"t distribution, df = n − 1"]]);
  const r3=readouts(lab3,[["t","t statistic","samp"],["p","p-value","samp"],
    ["tc","critical value","bad sm"],["a","α","sm"],["df","degrees of freedom","sm"],
    ["ci","confidence interval","sm"]]);
  const verdict=el("div","verdict"); lab3.append(verdict);
  const c3=el("div","ctrls"); lab3.append(c3);
  const mu0B=slider(c3,{label:"The value you are testing against · μ₀",
    min:40,max:64,step:0.5,value:50,fmt:v=>v.toFixed(1),on:v=>{mu0=v;mu0A.set(v);go();}});
  mu0B.input.closest(".ctrl").classList.add("hero");
  host.append(lab3);

  /* ================= 4 and 5. the arithmetic ================= */
  const lab4=el("div","lab");
  sect(lab4,4,"The same three steps, with your numbers in them");
  const calcA=el("div","calc"); lab4.append(calcA);
  const calcNote=el("p","labnote"); lab4.append(calcNote);
  host.append(lab4);
  const lab5=el("div","lab");
  sect(lab5,5,"Running it backwards · estimating μ from the same sample");
  const calcB=el("div","calc"); lab5.append(calcB);
  const calcNote2=el("p","labnote"); lab5.append(calcNote2);
  host.append(lab5);

  const R=a=>"<mrow>"+a+"</mrow>";
  const N=v=>"<mn>"+String(v).split("-").join("−")+"</mn>";
  const I=v=>'<mi mathvariant="normal">'+v+"</mi>";
  const O=v=>"<mo>"+v+"</mo>";
  const FR=(a,b)=>"<mfrac>"+R(a)+R(b)+"</mfrac>";
  const RT=a=>"<msqrt>"+R(a)+"</msqrt>";
  const PAR=a=>R(O("(")+a+O(")"));
  const XB='<mover accent="true"><mi mathvariant="normal">x</mi><mo>&#xaf;</mo></mover>';
  const MUH='<mover accent="true"><mi mathvariant="normal">&#x3bc;</mi><mo>&#x5e;</mo></mover>';
  const MU0='<msub><mi mathvariant="normal">&#x3bc;</mi><mn>0</mn></msub>';
  const SE='<mi mathvariant="normal">SE</mi>';
  const TSTAR='<msup><mi mathvariant="normal">t</mi><mo>*</mo></msup>';
  const TDF=d=>'<msub><mi mathvariant="normal">T</mi><mn>'+d+'</mn></msub>';
  const SP='<mspace width="0.75em"></mspace>';
  function crow(host,step,title,sym,num,res,tone){
    if(num==null){ num=res; res=null; }
    const r=el("div","crow");
    const h=el("div","chead");
    h.append(el("span","cstep",step));
    h.append(el("span","ctitle",title));
    r.append(h);
    r.append(el("div","cmath",'<math display="block" class="mml">'+
      '<mstyle displaystyle="true"><mrow>'+
        R(sym)+SP+O("=")+SP+
        (res==null ? '<mstyle class="res '+(tone||"")+'">'+num+'</mstyle>'
                   : '<mrow class="num">'+num+'</mrow>'+SP+O("=")+SP+
                     '<mstyle class="res '+(tone||"")+'">'+res+'</mstyle>')+
      '</mrow></mstyle></math>'));
    host.append(r);
  }

  const SYM={two:"≠",gt:">",lt:"<"};
  function go(){
    const S=stats(), inside=S.lo<=mu0&&mu0<=S.hi;

    h0s.innerHTML="μ = "+fmt(mu0,1);
    h1s.innerHTML="μ "+SYM[tail]+" "+fmt(mu0,1);
    hint.innerHTML = tail==="two"
      ? "A two-sided test splits α between both tails, so each one holds "+fmt(alpha/2,3)+
        ". It asks only whether the mean is <b>different</b>; a difference either way counts."
      : "A one-sided test puts the whole of α = "+fmt(alpha,2)+" in one tail. That makes it "+
        "easier to reject in that direction and impossible to detect a difference the other way, "+
        "so the direction must be chosen <b>before</b> seeing the data.";

    r1.xb.textContent=fmt(S.xb,2);
    r1.s.textContent=fmt(S.s,2);   r1.se.textContent=fmt(S.se,3);
    r1.n.textContent=n;            r1.mu.textContent=fmt(mu,1);

    r3.t.textContent=fmt(S.t,3);
    r3.p.textContent=S.p<0.0001?"< 0.0001":fmt(S.p,4);
    r3.tc.textContent=(tail==="two"?"±":tail==="lt"?"−":"")+fmt(S.tc,3);
    r3.a.textContent=fmt(alpha,2);
    r3.df.textContent=S.df;
    r3.ci.textContent=fmt(S.lo,2)+" to "+fmt(S.hi,2);
    r3.p.className="v samp";

    verdict.className="verdict "+(S.rej?"rej":"keep");
    verdict.innerHTML=(S.rej
      ? "<b>Reject H₀</b><span>p = "+(S.p<0.0001?"< 0.0001":fmt(S.p,4))+
        " is below α = "+fmt(alpha,2)+", so "+fmt(mu0,1)+" is not a believable value for μ.</span>"
      : "<b>Do not reject H₀</b><span>p = "+fmt(S.p,4)+" is not below α = "+fmt(alpha,2)+
        ", so "+fmt(mu0,1)+" stays believable — which is not the same as proving it true.</span>");

    const moe=S.half;
    calcA.textContent="";
    crow(calcA,"1","How much does a sample mean of this size wobble?",
      SE+O("=")+FR(I("s"),RT(I("n"))), FR(N(fmt(S.s,2)),RT(N(n))), N(fmt(S.se,3)),"samp");
    crow(calcA,"2","How many of those wobbles from the value you are testing?",
      I("t")+O("=")+FR(XB+O("−")+MU0,FR(I("s"),RT(I("n")))),
      FR(N(fmt(S.xb,2))+O("−")+N(fmt(mu0,1)),N(fmt(S.se,3))),
      N(fmt(S.t,3)),"samp");
    crow(calcA,"3","How often would t be at least this extreme if H₀ were true?",
      I("p")+O("=")+(tail==="two"
        ? N(2)+O("⋅")+I("P")+PAR(TDF(S.df)+O(">")+O("|")+I("t")+O("|"))
        : I("P")+PAR(TDF(S.df)+O(tail==="gt"?">":"<")+I("t"))),
      (tail==="two"
        ? N(2)+O("⋅")+I("P")+PAR(TDF(S.df)+O(">")+N(fmt(Math.abs(S.t),3)))
        : I("P")+PAR(TDF(S.df)+O(tail==="gt"?">":"<")+N(fmt(S.t,3)))),
      (S.p<0.0001?O("<")+N("0.0001"):N(fmt(S.p,4))),S.rej?"bad":"good");
    calcNote.innerHTML="Step 2 is the whole statistic: <b>t counts standard errors</b>. A t of "+
      fmt(S.t,2)+" says the sample mean sits "+fmt(Math.abs(S.t),2)+" standard errors "+
      (S.t>=0?"above":"below")+" "+fmt(mu0,1)+". Step 3 turns that distance into a probability — "+
      "it is the gold area on the chart above, read as a number.";

    calcB.textContent="";
    crow(calcB,"1","The best single guess for the population mean",
      XB, null, N(fmt(S.xb,2)),"samp");
    crow(calcB,"2","Go out the critical number of standard errors",
      TSTAR+O("⋅")+SE, N(fmt(tCrit(1-alpha/2,S.df),3))+O("⋅")+N(fmt(S.se,3)),
      N(fmt(moe,2)),"bad");
    crow(calcB,"3","That interval is your estimate of the population mean",
      I("μ")+O("=")+XB+O("±")+TSTAR+O("⋅")+FR(I("s"),RT(I("n"))),
      N(fmt(S.xb,2))+O("±")+N(fmt(moe,2)),
      O("[")+N(fmt(S.lo,2))+O(",")+N(fmt(S.hi,2))+O("]"),inside?"good":"bad");
    calcNote2.innerHTML="Same three ingredients, run the other way. The test asks <b>is "+
      fmt(mu0,1)+" believable?</b> and answers yes or no; the interval asks <b>which values are "+
      "believable?</b> and hands back a range. Right now "+fmt(mu0,1)+" is <b>"+
      (inside?"inside":"outside")+"</b> that range, which is exactly why the test "+
      (inside?"did not reject":"rejected")+" it. Drag μ₀ to the edge of the interval and "+
      "p lands on "+fmt(alpha,2)+".";

    cv1.render(); cv3.render();
  }
  go();
 }
});
</script>

<script>
/* ============================================================ 2. the two errors */
MODULES.push({
 name:"Type I & II errors",
 title:"Two ways to be wrong",
 lede:"One sample, one target — the same test you just ran. You only ever get <b>one</b> sample, "+
      "and you either reject the target or you keep it. Both answers can be wrong, and the two "+
      "ways of being wrong have names.",
 build(host){
  const sigma=10;
  let mu0=30, mu=34, n=25, alpha=0.05, seed=11;
  let xb=null, tally={tp:0,fp:0,tn:0,fn:0}, dots=[];

  const SE=()=>sigma/Math.sqrt(n);
  const zc=()=>zCrit(1-alpha/2);
  const loCut=()=>mu0-zc()*SE(), hiCut=()=>mu0+zc()*SE();
  const targetRight=()=>Math.abs(mu-mu0)<0.05;
  const drawMean=r=>{let s=0; for(let i=0;i<n;i++) s+=mu+sigma*gauss(r); return s/n;};
  const rejects=m=>m<loCut()||m>hiCut();

  function take(k){
    const r=rng(seed); seed=(seed*7919+13)%99991;
    for(let i=0;i<k;i++){
      const m=drawMean(r), rej=rejects(m);
      xb=m; dots.push({m,rej});
      if(targetRight()) rej?tally.fp++:tally.tn++;
      else              rej?tally.tp++:tally.fn++;
    }
    if(dots.length>400) dots=dots.slice(-400);
    go();
  }
  function reset(){ xb=null; tally={tp:0,fp:0,tn:0,fn:0}; dots=[]; go(); }

  /* ---------------- 1. one sample against the target ---------------- */
  const lab=el("div","lab");
  sect(lab,1,"Your sample against the target");
  const fig=el("div","figwrap"); lab.append(fig);

  const cv=makeCanvas(fig,0.44,(c,W,H)=>{
    const se=SE(), a=loCut(), b=hiCut();
    const lo=Math.min(mu0-4.3*se, mu-3.4*se), hi=Math.max(mu0+4.3*se, mu+3.4*se);
    const fr=frame(c,W,H,[52,16,44,16],[lo,hi],[0,normPdf(0)/se*1.30]);
    fr.grid(6,0,x=>x.toFixed(0),null);
    fr.axisLabel("the mean of your sample, in minutes");

    /* the ONE distribution the test uses: what x̄ does if the target is right */
    const pdf=x=>normPdf((x-mu0)/se)/se;
    const pts=curvePts(pdf,lo,hi,320);
    fr.clipIn(()=>{
      fr.area(pts.filter(q=>q[0]>=b),tint("--bad",0.46));
      fr.area(pts.filter(q=>q[0]<=a),tint("--bad",0.46));
      fr.fade(pts,tint("--curve",0.14),tint("--curve",0.01));
      fr.line(pts,css("--curve"),2.8);
      [a,b].forEach(v=>fr.vline(v,css("--text-2"),1.5,[4,4]));

      /* every sample you have drawn, sitting on the axis, coloured by your decision */
      const base=fr.B-10, used={};
      dots.slice(-240).forEach(d=>{
        const x=Math.round(fr.X(d.m)); used[x]=(used[x]||0)+1;
        const y=base-(used[x]-1)*4.4;
        if(y<fr.T+6) return;
        c.beginPath(); c.arc(x,y,2.7,0,7);
        c.fillStyle=d.rej?tint("--bad",0.62):tint("--good",0.55); c.fill();
      });
    });

    /* the target, and your one sample mean */
    fr.vline(mu0,css("--curve"),2.2);
    if(xb!=null){
      const col=rejects(xb)?css("--bad"):css("--good");
      c.save();
      c.beginPath(); c.moveTo(fr.X(xb),fr.T+30); c.lineTo(fr.X(xb),fr.B);
      c.strokeStyle=col; c.lineWidth=2.6; c.stroke();
      c.beginPath(); c.arc(fr.X(xb),fr.T+30,5.5,0,7);
      c.fillStyle=col; c.fill();
      c.strokeStyle=css("--card"); c.lineWidth=2; c.stroke();
      c.restore();
    }

    c.font='700 11.5px "Commissioner",sans-serif'; c.textAlign="center"; c.textBaseline="top";
    function chip(px,py,text,colour){
      const wd=c.measureText(text).width;
      px=clamp(px,fr.L+wd/2+4,fr.R-wd/2-4);
      c.fillStyle=css("--card"); c.globalAlpha=.92;
      c.fillRect(px-wd/2-6,py-3,wd+12,18); c.globalAlpha=1;
      c.fillStyle=colour; c.fillText(text,px,py);
    }
    chip(fr.X(mu0), fr.T-30, "target μ₀ = "+fmt(mu0,1), css("--curve"));
    if(xb!=null) chip(fr.X(xb), fr.T+6, "your x̄ = "+fmt(xb,1),
                      rejects(xb)?css("--bad"):css("--good"));

  });

  legend(lab,[[css("--curve"),"what your sample mean does if the target is right"],
    [tint("--bad",0.85),"reject the target out here · area = α","box"],
    [tint("--good",0.75),"a sample you kept","box"],
    [tint("--bad",0.62),"a sample you rejected","box"]]);

  const verdict=el("div","verdict"); verdict.style.margin="0 18px 4px"; lab.append(verdict);

  const ro=readouts(lab,[["xb","your sample mean","samp"],["dec","your decision","sm"],
    ["truth","was the target right?","sm"],["call","so your call was","sm"],
    ["cut","keep between","sm"]]);

  const ctr=el("div","ctrls"); lab.append(ctr);
  const s0=slider(ctr,{label:"The target you are testing against · μ₀",
    min:24,max:40,step:0.5,value:30,fmt:v=>v.toFixed(1),on:v=>{mu0=v;reset();}});
  s0.input.closest(".ctrl").classList.add("hero");
  slider(ctr,{label:"The truth your test cannot see · μ · simulation only",
    min:24,max:40,step:0.5,value:34,fmt:v=>v.toFixed(1),on:v=>{mu=v;reset();}});
  slider(ctr,{label:"Sample size n",min:5,max:200,step:5,value:25,on:v=>{n=v;reset();}});
  slider(ctr,{label:"Significance level α",min:0.01,max:0.20,step:0.01,value:0.05,
    fmt:v=>v.toFixed(2),on:v=>{alpha=v;reset();}});
  const bt=buttons(ctr,null,[
    {t:"Draw one sample",big:true,on:()=>take(1)},
    {t:"100",on:()=>take(100)},
    {t:"1,000",on:()=>take(1000)},
    {t:"Reset",on:reset}]);
  bt[0].el.closest(".ctrl").classList.add("wide");
  host.append(lab);

  /* ---------------- 2. the tally ---------------- */
  const lab2=el("div","lab");
  sect(lab2,2,"Do it again and again");
  const note2=el("p","labnote"); lab2.append(note2);
  const T=el("div","tblwrap"); lab2.append(T);
  host.append(lab2);

  function grid(){
    T.textContent="";
    const N=tally.tp+tally.fp+tally.tn+tally.fn;
    const pct=v=>N?((v/N)*100).toFixed(0)+"%":"—";
    const right=targetRight();
    const tb=el("table","tbl"), th=el("thead"), hr=el("tr");
    ["","The target was right","The target was wrong"].forEach(h=>hr.append(el("th",null,h)));
    th.append(hr); tb.append(th);
    const bd=el("tbody");
    const cell=(count,label,tone,live)=>
      ["<b>"+label+"</b><br>"+(live?count+" of "+N+" · "+pct(count):"did not happen"),
       tone,live];
    const rows=[
     ["You rejected the target",
      cell(tally.fp,"Type I error","bad",right),
      cell(tally.tp,"Correct · you caught it","good",!right)],
     ["You kept the target",
      cell(tally.tn,"Correct","good",right),
      cell(tally.fn,"Type II error","warn",!right)]];
    rows.forEach(r=>{
      const tr=el("tr");
      tr.append(el("td",null,"<b>"+r[0]+"</b>"));
      [r[1],r[2]].forEach(([html,tone,live])=>{
        const td=el("td",null,html);
        if(live){ td.style.background="color-mix(in srgb,var(--"+tone+") 12%,transparent)";
                  td.style.color="var(--"+tone+")"; }
        else    { td.style.color="var(--text-3)"; td.style.opacity=".55"; }
        tr.append(td);
      });
      bd.append(tr);
    });
    tb.append(bd); T.append(tb);
  }

  function go(){
    cv.render(); grid();
    const N=tally.tp+tally.fp+tally.tn+tally.fn, right=targetRight();
    ro.xb.textContent   = xb==null?"—":fmt(xb,2);
    ro.dec.textContent  = xb==null?"—":(rejects(xb)?"reject the target":"keep the target");
    ro.truth.textContent= right?"yes, it was right":"no, the truth is "+fmt(mu,1);
    ro.cut.textContent  = fmt(loCut(),1)+" – "+fmt(hiCut(),1);
    if(xb==null){ ro.call.textContent="—"; ro.call.className="v sm"; }
    else{
      const rej=rejects(xb), ok = right ? !rej : rej;
      ro.call.textContent = ok ? "correct" : (right?"a Type I error":"a Type II error");
      ro.call.className   = "v sm "+(ok?"good":right?"bad":"warn");
    }
    ro.dec.className="v sm "+(xb==null?"":rejects(xb)?"bad":"good");

    if(xb==null){
      verdict.className="verdict keep";
      verdict.innerHTML="<b>Draw a sample to start</b><span>One sample, one decision.</span>";
    }else if(rejects(xb)){
      verdict.className="verdict "+(right?"rej":"keep");
      verdict.innerHTML="<b>x̄ = "+fmt(xb,1)+" is outside "+fmt(loCut(),1)+" to "+fmt(hiCut(),1)+
        ", so you reject the target</b><span>"+
        (right?"But the target really was "+fmt(mu0,1)+". This is a Type I error."
              :"And the target really was wrong. Correct call.")+"</span>";
    }else{
      verdict.className="verdict "+(right?"keep":"rej");
      verdict.innerHTML="<b>x̄ = "+fmt(xb,1)+" is inside "+fmt(loCut(),1)+" to "+fmt(hiCut(),1)+
        ", so you keep the target</b><span>"+
        (right?"And the target really was "+fmt(mu0,1)+". Correct call."
              :"But the truth is "+fmt(mu,1)+", so you missed it. This is a Type II error.")+"</span>";
    }

    if(!N){
      note2.innerHTML="You only ever get one sample in real life. Here you can keep drawing, so "+
        "you can see how often that one sample would have sent you the wrong way.";
    }else if(right){
      note2.innerHTML="The target is right, so the only mistake available is a <b>Type I error</b> — "+
        "rejecting something true. Out of "+N+" samples you rejected <b>"+tally.fp+"</b> of them, "+
        "about <b>"+((tally.fp/N)*100).toFixed(0)+"%</b>. That is α = "+alpha.toFixed(2)+
        " showing up as a rate. <b>You chose it.</b>";
    }else{
      const miss=N?((tally.fn/N)*100).toFixed(0):0;
      note2.innerHTML="The target is wrong by <b>"+fmt(Math.abs(mu-mu0),1)+" minutes</b>, so the only "+
        "mistake available is a <b>Type II error</b> — missing it. Out of "+N+" samples you kept the "+
        "target <b>"+tally.fn+"</b> times, about <b>"+miss+"%</b>. <b>You did not choose that.</b> "+
        "It follows from how wrong the target is and how big n is — raise n and watch it fall.";
    }
  }
  go();
 }
});
</script>

<script>
/* ============================================================ 2b. hypotheses in code */
MODULES.push({
 name:"Write the hypotheses",
 title:"From a sentence to a p-value",
 lede:"Read the situation, write H₀ and H₁, and watch the direction you chose land in the "+
      "code as the <code>alternative</code> argument. <b>Change the direction and the p-value "+
      "changes</b> — on two of these scenarios it changes the answer.",
 build(host){
  const ALT={two:"two-sided",gt:"greater",lt:"less"};
  const SC=[
   {k:"one", tab:"Clinic wait", col:"wait_min", unit:"minutes",
    text:"A walk-in clinic advertises an average wait of <b>30 minutes</b>. Patients have been "+
         "complaining, and you suspect the real wait is <b>longer</b> than advertised. You time "+
         "40 visits.",
    param:"μ, the mean wait in minutes", n:40, xb:33.4, s:8.6, mu0:30, want:"gt",
    opts:[["The mean wait is longer than 30 minutes, and the data support that.",1],
          ["The mean wait is exactly 33.4 minutes.",0],
          ["There is no evidence the wait differs from 30 minutes.",0]],
    why:["p_val = 0.008 is below α = 0.05, so you reject H₀ and conclude the wait runs "+
         "longer than advertised. Note what you did not learn: how much longer. For that you want "+
         "a confidence interval.",
         "33.4 is your sample mean, not μ. The test is about the unseen population mean.",
         "That is the conclusion for a large p-value. Yours is 0.008."]},

   {k:"one", tab:"Print turnaround", col:"turnaround_hrs", unit:"hours",
    text:"A print shop quotes an average turnaround of <b>48 hours</b>. You have no prior belief "+
         "about which way it is off — you just want to know whether the quote is <b>wrong</b>. "+
         "You pull 32 jobs.",
    param:"μ, the mean turnaround in hours", n:32, xb:44.9, s:9.4, mu0:48, want:"two",
    opts:[["At α = 0.05 there is not enough evidence that the true mean differs from 48 hours.",1],
          ["The true mean turnaround is 48 hours.",0],
          ["Turnaround is faster than quoted, and the data prove it.",0]],
    why:["p_val = 0.072 is above α = 0.05, so you keep H₀. <b>Keeping H₀ is not "+
         "proving it.</b> It means this sample was not strong enough to rule 48 out.",
         "Failing to reject never proves the null. 48 stays believable; it is not established.",
         "This is the trap in this scenario. Pick <code>alternative='less'</code> and p_val drops "+
         "to 0.036, which would reject — but you only get to use a one-sided test if you "+
         "committed to that direction <b>before</b> seeing the data. Here you did not."]},

   {k:"one", tab:"Triage protocol", col:"door_to_doc", unit:"minutes",
    text:"A new triage protocol is meant to <b>cut</b> door-to-doctor time below the old standard "+
         "of <b>25 minutes</b>. You measure 28 arrivals after the change.",
    param:"μ, the mean door-to-doctor time", n:28, xb:22.6, s:6.1, mu0:25, want:"lt",
    opts:[["Door-to-doctor time is below 25 minutes, and the data support that.",1],
          ["The protocol caused the drop in door-to-doctor time.",0],
          ["The result is not significant at α = 0.05.",0]],
    why:["p_val = 0.024 is below α = 0.05, so you reject H₀ in the direction you named.",
         "A before-and-after comparison with no control group cannot establish cause. Something "+
         "else may have changed at the same time.",
         "With <code>alternative='less'</code> p_val = 0.024, which is significant. Two-sided it "+
         "is 0.047 — still significant, but only just."]},

   {k:"paired", tab:"Training scores", col:"after", col2:"before", unit:"points",
    text:"Twenty-four staff take a skills test, attend a training day, then take it again. The "+
         "training is supposed to <b>raise</b> scores. Each person is measured twice, so you work "+
         "with the 24 <b>differences</b>.",
    param:"μ<sub>diff</sub>, the mean change in score", n:24, xb:3.1, s:7.4, mu0:0, want:"gt",
    opts:[["Scores rose on average, and at α = 0.05 the data support that.",1],
          ["There is no evidence scores changed.",0],
          ["Every member of staff improved.",0]],
    why:["p_val = 0.026 is below α = 0.05. <b>This is the scenario where direction decides "+
         "the answer</b> — two-sided the p-value is 0.052 and you would keep H₀.",
         "That is the two-sided reading. You predicted a rise before collecting data, so the "+
         "one-sided test is the honest one here.",
         "A mean rise of 3.1 points says nothing about individuals; s = 7.4 means plenty went down."]},

   {k:"ind", tab:"Two wards", col:"los_days", unit:"days",
    text:"You compare length of stay on <b>Ward A</b> and <b>Ward B</b>. They treat similar "+
         "patients and you have no reason to expect one to be longer — you want to know "+
         "whether they <b>differ</b>.",
    param:"μ<sub>A</sub> and μ<sub>B</sub>, the two mean stays",
    g1:{n:38,m:5.8,s:2.1,name:"A"}, g2:{n:42,m:4.9,s:1.7,name:"B"}, want:"two",
    opts:[["Mean length of stay differs between the wards at α = 0.05.",1],
          ["Ward A is less efficient than Ward B.",0],
          ["The wards have the same mean length of stay.",0]],
    why:["p_val = 0.040 is below α = 0.05, so the two means differ by more than sampling "+
         "noise comfortably explains. The gap is 0.9 days.",
         "The test compares length of stay, not efficiency. Case mix, staffing and admission "+
         "policy all sit behind that 0.9 days.",
         "You rejected that. And even a large p-value would not have proved it."]}
  ];

  let si=0, dir="two", answered=-1;

  function S(){ return SC[si]; }
  function calc(){
    const s=S();
    if(s.k==="ind"){
      const v1=s.g1.s*s.g1.s/s.g1.n, v2=s.g2.s*s.g2.s/s.g2.n, se=Math.sqrt(v1+v2);
      const t=(s.g1.m-s.g2.m)/se;
      const df=Math.pow(v1+v2,2)/(v1*v1/(s.g1.n-1)+v2*v2/(s.g2.n-1));
      return {t,df,se};
    }
    const se=s.s/Math.sqrt(s.n);
    return {t:(s.xb-s.mu0)/se, df:s.n-1, se};
  }
  const pOf=(t,df,d)=> d==="two" ? 2*(1-tCdf(Math.abs(t),df))
                     : d==="gt"  ? 1-tCdf(t,df) : tCdf(t,df);

  /* ---------- 1. the situation ---------- */
  const lab1=el("div","lab");
  sect(lab1,1,"The situation");
  const picker1=el("div","ctrls"); picker1.style.borderTop="0"; picker1.style.background="transparent";
  const pr=el("div","ctrl"); pr.style.gridColumn="1/-1";
  pr.append(el("label",null,"<span>Scenario</span>"));
  const prow=el("div","btnrow"); prow.style.marginTop="8px";
  SC.forEach((s,i)=>{ const b=el("button","b"+(i===0?" on":""),s.tab);
    b.addEventListener("click",()=>{si=i;dir="two";answered=-1;
      [...prow.children].forEach((x,j)=>x.classList.toggle("on",j===i)); go();});
    prow.append(b); });
  pr.append(prow); picker1.append(pr); lab1.append(picker1);
  const story=el("p","labnote"); lab1.append(story);
  const dataT=el("div","tblwrap"); lab1.append(dataT);
  host.append(lab1);

  /* ---------- 2. the hypotheses ---------- */
  const lab2=el("div","lab");
  sect(lab2,2,"Write H₀ and H₁");
  const paramLine=el("p","labnote"); lab2.append(paramLine);
  const hyp=el("div","hyp");
  const h0=el("div"), h1=el("div");
  h0.append(el("div","k","Null hypothesis H₀")); const h0s=el("div","s"); h0.append(h0s);
  h1.append(el("div","k","Alternative H₁"));     const h1s=el("div","s"); h1.append(h1s);
  hyp.append(h0,h1); lab2.append(hyp);
  const dctl=el("div","ctrls");
  const dbox=el("div","ctrl"); dbox.style.gridColumn="1/-1";
  dbox.append(el("label",null,"<span>Which way does H₁ point?</span>"));
  const drow=el("div","btnrow"); drow.style.marginTop="8px";
  const DIRS=[["two","≠  different in either direction"],
              ["gt",">  bigger than the target"],
              ["lt","<  smaller than the target"]];
  DIRS.forEach(([k,label])=>{ const b=el("button","b"+(k==="two"?" on":""),label);
    b.addEventListener("click",()=>{dir=k;answered=-1;
      [...drow.children].forEach(x=>x.classList.toggle("on",x===b)); go();});
    drow.append(b); });
  dbox.append(drow); dctl.append(dbox); lab2.append(dctl);
  const dirNote=el("div","verdict"); dirNote.style.margin="0 18px 16px"; lab2.append(dirNote);
  host.append(lab2);

  /* ---------- 3. the code ---------- */
  const lab3=el("div","lab");
  sect(lab3,3,"That direction is an argument in the code");
  const codeWrap=el("div"); codeWrap.style.padding="16px 18px 4px";
  const codeBox=el("pre","codebox"); codeWrap.append(codeBox); lab3.append(codeWrap);
  const codeNote=el("p","labnote"); lab3.append(codeNote);
  host.append(lab3);

  /* ---------- 4. the output ---------- */
  const lab4=el("div","lab");
  sect(lab4,4,"What it prints");
  const ro=readouts(lab4,[["t","t_stat","samp"],["p","p_val","sm"],
    ["df","degrees of freedom","sm"],["dec","at α = 0.05","sm"]]);
  const cmpT=el("div","tblwrap"); lab4.append(cmpT);
  const cmpNote=el("p","labnote"); lab4.append(cmpNote);
  host.append(lab4);

  /* ---------- 5. the interpretation ---------- */
  const lab5=el("div","lab");
  sect(lab5,5,"Now say what it means");
  const qb=el("div","qbody"); lab5.append(qb);
  host.append(lab5);

  function dataTable(){
    const s=S(); dataT.textContent="";
    const tb=el("table","tbl"), th=el("thead"), hr=el("tr");
    const bd=el("tbody");
    if(s.k==="ind"){
      ["group","n","mean","sd"].forEach(h=>hr.append(el("th",null,h)));
      [s.g1,s.g2].forEach(g=>{ const tr=el("tr");
        [["Ward "+g.name,0],[g.n,1],[fmt(g.m,2)+" "+s.unit,1],[fmt(g.s,2),1]]
          .forEach(([v,m])=>{const td=el("td",m?"mono":null,String(v));tr.append(td);});
        bd.append(tr); });
    }else{
      ["what","value"].forEach(h=>hr.append(el("th",null,h)));
      const rows=[["sample size n",String(s.n)],
                  [s.k==="paired"?"mean difference":"sample mean",fmt(s.xb,2)+" "+s.unit],
                  [s.k==="paired"?"sd of the differences":"sample sd",fmt(s.s,2)],
                  [s.k==="paired"?"the value you test against":"the target μ₀",
                   fmt(s.mu0,1)+" "+(s.k==="paired"?"(no change)":s.unit)]];
      rows.forEach(([a,b])=>{const tr=el("tr");
        tr.append(el("td",null,a)); tr.append(el("td","mono",b)); bd.append(tr);});
    }
    th.append(hr); tb.append(th); tb.append(bd); dataT.append(tb);
  }

  function hypText(){
    const s=S(), SYM={two:"≠",gt:">",lt:"<"};
    if(s.k==="ind"){
      h0s.innerHTML="μ<sub>A</sub> = μ<sub>B</sub>";
      h1s.innerHTML="μ<sub>A</sub> "+SYM[dir]+" μ<sub>B</sub>";
    }else if(s.k==="paired"){
      h0s.innerHTML="μ<sub>diff</sub> = 0";
      h1s.innerHTML="μ<sub>diff</sub> "+SYM[dir]+" 0";
    }else{
      h0s.innerHTML="μ = "+fmt(s.mu0,1);
      h1s.innerHTML="μ "+SYM[dir]+" "+fmt(s.mu0,1);
    }
  }

  function codeText(){
    const s=S(), a=ALT[dir];
    const A="<span class='arg'>alternative='"+a+"'</span>";
    let call;
    if(s.k==="ind")
      call="t_stat, p_val = stats.ttest_ind(\n        ward_a['"+s.col+"'], ward_b['"+s.col+"'],\n"+
           "        equal_var=False, "+A+")";
    else if(s.k==="paired")
      call="t_stat, p_val = stats.ttest_rel(\n        df['"+s.col+"'], df['"+s.col2+"'], "+A+")";
    else
      call="t_stat, p_val = stats.ttest_1samp(\n        df['"+s.col+"'], popmean="+fmt(s.mu0,0)+
           ", "+A+")";
    codeBox.innerHTML="<span class='cmt'>from scipy import stats</span>\n\n"+call+
      "\n\n<span class='cmt'>print(t_stat, p_val)</span>";
  }

  function cmpTable(){
    const s=S(), C=calc(); cmpT.textContent="";
    const tb=el("table","tbl"), th=el("thead"), hr=el("tr");
    ["alternative","H₁ reads","p_val","at α = 0.05"].forEach(h=>hr.append(el("th",null,h)));
    th.append(hr); tb.append(th);
    const bd=el("tbody"), SYM={two:"≠",gt:">",lt:"<"};
    ["two","gt","lt"].forEach(k=>{
      const p=pOf(C.t,C.df,k), tr=el("tr");
      if(k===dir) tr.className="cur";
      tr.append(el("td","mono","'"+ALT[k]+"'"));
      tr.append(el("td",null,s.k==="ind"?"μ<sub>A</sub> "+SYM[k]+" μ<sub>B</sub>"
                 :s.k==="paired"?"μ<sub>diff</sub> "+SYM[k]+" 0"
                 :"μ "+SYM[k]+" "+fmt(s.mu0,1)));
      tr.append(el("td","mono",p.toFixed(4)));
      const td=el("td",null,p<0.05?"reject H₀":"keep H₀");
      td.style.color=p<0.05?"var(--bad)":"var(--good)"; td.style.fontWeight="700";
      tr.append(td); bd.append(tr);
    });
    tb.append(bd); cmpT.append(tb);
    const ps=["two","gt","lt"].map(k=>pOf(C.t,C.df,k));
    const flips=(ps[0]<0.05)!==(ps[1]<0.05)||(ps[0]<0.05)!==(ps[2]<0.05);
    cmpNote.innerHTML=(flips
      ? "<b>Look at the last column.</b> The direction you pick changes the decision on this "+
        "scenario, not just the number. That is exactly why <code>alternative</code> has to come "+
        "from the question you asked before you saw the data — never from whichever option "+
        "gives the smaller p-value."
      : "Notice that <code>'greater'</code> and <code>'less'</code> always add to 1, and "+
        "<code>'two-sided'</code> is twice the smaller of them. One calculation, read three ways.");
  }

  function quiz(){
    const s=S(); qb.textContent="";
    qb.append(el("p","qstem","Which statement is the right conclusion here?"));
    s.opts.forEach(([text,ok],i)=>{
      const b=el("button","qopt b");
      b.append(el("span","ltr","ABC"[i]));
      b.append(el("span",null,text));
      if(answered>=0){
        if(ok) b.classList.add("right");
        else if(i===answered) b.classList.add("wrong");
        b.disabled=true;
      }else{
        b.addEventListener("click",()=>{answered=i;quiz();});
      }
      qb.append(b);
    });
    if(answered>=0){
      const ok=!!s.opts[answered][1];
      const w=el("div","why");
      w.append(el("span","pill "+(ok?"ok":"no"),ok?"CORRECT":"NOT QUITE"));
      w.append(el("p",null,s.why[answered]));
      qb.append(w);
      const again=el("button","b","Try another scenario");
      again.style.marginTop="10px";
      again.addEventListener("click",()=>{si=(si+1)%SC.length;dir="two";answered=-1;
        [...prow.children].forEach((x,j)=>x.classList.toggle("on",j===si));
        [...drow.children].forEach((x,j)=>x.classList.toggle("on",j===0));
        go();});
      qb.append(again);
    }
  }

  function go(){
    const s=S(), C=calc(), p=pOf(C.t,C.df,dir);
    story.innerHTML=s.text;
    paramLine.innerHTML="The parameter under test is <b>"+s.param+"</b>. H₀ always says it "+
      "equals the target; H₁ says which way you think it is off.";
    dataTable(); hypText(); codeText(); cmpTable(); quiz();

    const right=dir===s.want;
    dirNote.className="verdict "+(right?"keep":"rej");
    dirNote.innerHTML=right
      ? "<b>That matches the situation</b><span>"+
        (s.want==="two"?"Nothing in the wording points one way, so the test stays two-sided."
         :s.want==="gt"?"The wording says you expected it to be bigger, so H₁ points up."
         :"The wording says it should come out lower, so H₁ points down.")+"</span>"
      : "<b>Read the situation again</b><span>"+
        (s.want==="two"?"Nothing in this scenario tells you which way it would be off, so a "+
           "one-sided test is not justified here."
         :s.want==="gt"?"The scenario names a direction — it says you expected the value to "+
           "be <i>larger</i> than the target."
         :"The scenario names a direction — it says the value should come out <i>smaller</i> "+
           "than the target.")+"</span>";

    codeNote.innerHTML="Everything else in that call is fixed by the data. <b>The only thing you "+
      "chose is the highlighted argument</b>, and you chose it when you wrote H₁ — not "+
      "after seeing the output.";

    ro.t.textContent=fmt(C.t,4);
    ro.p.textContent=p.toFixed(4);
    ro.df.textContent=s.k==="ind"?fmt(C.df,2):String(C.df);
    ro.dec.textContent=p<0.05?"reject H₀":"keep H₀";
    ro.dec.className="v sm "+(p<0.05?"bad":"good");
    ro.p.className="v sm "+(p<0.05?"bad":"good");
  }
  go();
 }
});
</script>

<script>
/* ============================================================ 3. pick your test */
MODULES.push({
 name:"Pick your test",
 title:"Three questions, one test",
 lede:"Answer in order. Each answer lights the next branch, and the ten tests sit at the ends of "+
      "the tree. <b>The design and the shape of the data choose the test</b> &mdash; never the p-value "+
      "you were hoping for.",
 build(host){
  let q1=null,q2=null,q3=null;

  /* ---- small inline glyphs, drawn in currentColor ---- */
  const ICO={
   number:'<svg class="ico" viewBox="0 0 34 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 22h28"/><path d="M8 22V12M15 22V6M22 22V15M29 22V9"/></svg>',
   counts:'<svg class="ico" viewBox="0 0 34 26" fill="currentColor"><rect x="3" y="12" width="7" height="10" rx="2"/><rect x="13" y="5" width="7" height="17" rx="2"/><rect x="23" y="15" width="7" height="7" rx="2"/></svg>',
   one:'<svg class="ico" viewBox="0 0 34 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 21c6 0 5-15 11-15s5 15 11 15"/><path d="M28 4v18" stroke-dasharray="3 3"/></svg>',
   two:'<svg class="ico" viewBox="0 0 34 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M1 21c4 0 3-12 7-12s3 12 7 12"/><path d="M19 21c4 0 3-12 7-12s3 12 7 12"/></svg>',
   paired:'<svg class="ico" viewBox="0 0 34 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="7" cy="8" r="3.4"/><circle cx="27" cy="8" r="3.4"/><circle cx="7" cy="19" r="3.4"/><circle cx="27" cy="19" r="3.4"/><path d="M11 8h12M11 19h12" stroke-dasharray="3 3"/></svg>',
   many:'<svg class="ico" viewBox="0 0 34 26" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M1 21c3 0 2-10 5-10s2 10 5 10"/><path d="M12 21c3 0 2-13 5-13s2 13 5 13"/><path d="M23 21c3 0 2-8 5-8s2 8 5 8"/></svg>',
